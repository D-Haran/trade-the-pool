services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trade_the_pool
      POSTGRES_USER: trade_the_pool
      POSTGRES_PASSWORD: trade_the_pool
    ports: ['5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trade_the_pool -d trade_the_pool']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
  redis-data:
